name: Compile Android APK

on:
  push:
    branches:
      - "**"

concurrency:
  group: compile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-apk:
    name: Compile APK (Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check Unity secrets availability
        id: precheck
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Unity build skipped: missing UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.precheck.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity project structure
        if: steps.precheck.outputs.should_build == 'true'
        run: |
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -d Assets

      - name: Build APK with GameCI
        if: steps.precheck.outputs.should_build == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.20f1
          targetPlatform: Android
          androidExportType: androidPackage
          allowDirtyBuild: true
          buildName: OpenWorldRealisticMobileRacer_SUPERWORLD

      - name: Upload APK artifact
        if: steps.precheck.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/Android
          if-no-files-found: error

      - name: Build summary
        if: steps.precheck.outputs.should_build == 'true'
        run: |
          echo "Unity Android APK build completed for $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: android-apk" >> $GITHUB_STEP_SUMMARY
