name: Unity Android CI Build

on:
  push:
    branches:
      - "**"
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-android-build.yml"
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-android-build.yml"
  workflow_dispatch:

concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity project structure
        run: |
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -d Assets

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Android with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.20f1
          targetPlatform: Android
          androidExportType: androidAppBundle
          allowDirtyBuild: true
          buildName: OpenWorldRealisticMobileRacer_SUPERWORLD
          versioning: Semantic

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/Android
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "Unity Android build completed for $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: android-build" >> $GITHUB_STEP_SUMMARY
